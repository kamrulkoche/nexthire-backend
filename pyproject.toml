[project]
# Vercel installs dependencies from THIS list when pyproject.toml exists — it
# ignores requirements.txt. Runtime packages only (no pytest/ruff/mypy, which
# would only bloat the function). Keep the pins in step with requirements.txt,
# which stays the full dev install.
name = "nexthire-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.14.2",
    "pymongo==4.19.0",
    "tzdata==2026.4",
    "apscheduler==3.11.0",
    "defusedxml==0.7.1",
    "email-validator>=2.3.0",
    "python-dotenv==1.2.3",
    "PyJWT==2.13.0",
    "bcrypt>=4.1.0",
    "httpx>=0.28.1",
    "openpyxl==3.1.5",
    "fpdf2==2.9.0",
]

[tool.vercel]
# Vercel's FastAPI preset looks for a top-level `app` in main.py; ours is built
# by the factory in src/api/app.py.
entrypoint = "src.api.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "smoke: Smoke tests",
]

# As in hgs-backend, `--cov-fail-under` is deliberately NOT in addopts: a single-test
# run must not fail on global coverage. The gate lives on `make test-cov`.

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true

# Override for repository files - PyMongo documents are untyped dicts
[[tool.mypy.overrides]]
module = "*.infrastructure.repositories.*"
disable_error_code = ["arg-type", "attr-defined", "union-attr", "call-overload", "var-annotated", "operator", "misc", "unused-ignore", "type-var"]

# Override for the generic base repository: entity fields set through the
# TypeVar (``updated_at``) are not visible to mypy.
[[tool.mypy.overrides]]
module = "src.shared.infrastructure.base_repository"
disable_error_code = ["attr-defined"]

# Override for API route files - FastAPI infers return types from response_model,
# and Pydantic schema instantiation with optional fields
[[tool.mypy.overrides]]
module = "*.api.routes.*"
disable_error_code = ["no-untyped-def", "call-arg", "call-overload", "arg-type", "attr-defined", "union-attr"]

# Override for module-level api/dependencies.py files - FastAPI DI builders return inferred types
[[tool.mypy.overrides]]
module = "*.api.dependencies"
disable_error_code = ["no-untyped-def", "arg-type", "attr-defined", "union-attr", "call-overload", "unused-ignore"]

# Override for use cases - Pydantic construction from entities and raw documents.
[[tool.mypy.overrides]]
module = "*.application.use_cases.*"
disable_error_code = ["arg-type", "attr-defined", "union-attr", "call-overload", "no-untyped-def", "operator", "misc", "unused-ignore"]

# Override for domain entities - Pydantic Field overloads and ClassVar index lists.
[[tool.mypy.overrides]]
module = "*.domain.entities.*"
disable_error_code = ["call-overload", "unused-ignore"]

# Override for seed/bootstrap scripts - raw document access
[[tool.mypy.overrides]]
module = "scripts.*"
disable_error_code = ["arg-type", "assignment", "union-attr", "attr-defined", "var-annotated", "operator", "index", "call-arg", "no-untyped-def", "call-overload", "unused-ignore"]

[tool.bandit]
# Bandit reads from the .bandit file via --ini (not pyproject.toml directly).
# Kept in sync with it, as the reference project does.
# B101: assert used as a type guard in routes (guaranteed by the auth dependency)
# B105: false positives on enum values and settings field names
# B106: flags token_type="bearer" — the OAuth2 scheme name, not a credential
skips = ["B101", "B105", "B106"]
